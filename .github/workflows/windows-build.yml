# Builds the Windows NSIS installer on a hosted runner — we have no Windows
# hardware; this is the project's only Windows build path for now.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        shell: bash
        run: cd app && npm ci
      - name: Build Tauri app (NSIS)
        shell: bash
        run: cd app && npx tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: unmute-windows-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
