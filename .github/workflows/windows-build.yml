# Experimental Windows build for measuring whisper.cpp on a real gaming GPU.
# This disposable definition exists only long enough to dispatch the Vulkan
# spike from a workflow filename already known on the default branch. Restore
# the production workflow before opening or merging any PR. The CPU baseline
# is the immutable 0.1.2 artifact built from commit 4cb22e2.
name: Windows Vulkan experiment

on:
  workflow_dispatch:

jobs:
  windows-vulkan-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          prefix-key: v2-vulkan-1.4.350-clang
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        shell: bash
        run: cd app && npm ci

      - name: Install native build dependencies
        shell: pwsh
        run: |
          choco install ninja --no-progress -y
          choco install vulkan-sdk --version=1.4.350 --no-progress -y
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK directory not found' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$($sdk.FullName)\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "Using Vulkan SDK $($sdk.FullName)"

      - name: Build Vulkan Tauri app (NSIS)
        shell: bash
        env:
          CMAKE_GENERATOR: Ninja
          CC: clang-cl
          CXX: clang-cl
          CFLAGS: /arch:AVX2
          CXXFLAGS: /arch:AVX2 /EHsc
        run: cd app && npx tauri build --bundles nsis --features windows-vulkan

      - name: Prove the intended native backends were compiled
        shell: bash
        run: |
          cache=""
          while IFS= read -r candidate; do
            if grep -qE "GGML_VULKAN:BOOL=ON" "$candidate"; then
              cache="$candidate"
              break
            fi
          done < <(find app/src-tauri/target -path "*whisper*" -name CMakeCache.txt)
          if [ -z "$cache" ]; then echo "::error::no Vulkan whisper CMakeCache.txt found"; exit 1; fi
          grep -qE "CMAKE_C_COMPILER:.*clang" "$cache" \
            || { echo "::error::whisper was not built by clang"; exit 1; }
          grep -E "CMAKE_C_COMPILER:|GGML_VULKAN:BOOL=" "$cache"

      # Force the fallback so a future software/virtual Vulkan adapter on the
      # hosted image cannot make this smoke nondeterministic. The real RX 6700
      # XT test must instead show native confirmation and active=vulkan.
      - name: Install and smoke the Vulkan binary with CPU fallback
        shell: pwsh
        run: |
          $exe = (Get-ChildItem app\src-tauri\target\release\bundle\nsis\*.exe)[0].FullName
          $install = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer exit code $($install.ExitCode)" }

          $log = "$env:RUNNER_TEMP\unmute-vulkan-real.log"
          $env:UNMUTE_FORCE_CPU = '1'
          $process = Start-Process "$env:LOCALAPPDATA\Unmute\Unmute.exe" -RedirectStandardError $log -PassThru
          $ready = $false
          for ($second = 0; $second -lt 300; $second++) {
            Start-Sleep 1
            if ($process.HasExited) { break }
            if (Test-Path $log) {
              $text = Get-Content $log -Raw
              if (($text -match 'stt backend: requested=cpu active=cpu') -and
                  ($text -match 'captions: SttReady')) {
                $ready = $true
                break
              }
            }
          }
          if (-not $process.HasExited) { Stop-Process $process -Force }
          if (Test-Path $log) { Get-Content $log }
          if (-not $ready) { throw 'Vulkan binary did not confirm its CPU fallback and reach SttReady' }

          $uninstaller = "$env:LOCALAPPDATA\Unmute\uninstall.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exit code $($uninstall.ExitCode)" }
          Start-Sleep 5
          if (Test-Path "$env:LOCALAPPDATA\Unmute\Unmute.exe") { throw 'uninstall left binaries behind' }

      - name: Upload Vulkan installer
        uses: actions/upload-artifact@v4
        with:
          name: unmute-windows-vulkan-setup-${{ github.sha }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan-qa-log-${{ github.sha }}
          path: ${{ runner.temp }}/unmute-vulkan-real.log
          if-no-files-found: ignore
          retention-days: 30
