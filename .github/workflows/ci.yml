name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # cargo check doesn't build the frontend, but tauri's context macro
      # expects the dist dir to exist.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p app/dist && touch app/dist/index.html
      - name: Typecheck frontend
        shell: bash
        run: cd app && npm ci && npx tsc --noEmit
      - name: cargo check
        shell: bash
        run: cd app/src-tauri && cargo check --locked
      - name: cargo test
        shell: bash
        run: cd app/src-tauri && cargo test --locked
