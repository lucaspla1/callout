[package]
name = "callout"
version = "0.1.0"
description = "Live captions for Discord voice chat, in an in-game overlay"
authors = ["Lucas Pitchon and contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "callout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rubato = "5.0.0"
crossbeam-channel = "0.5.16"
voice_activity_detector = "0.2.1"
tauri-plugin-global-shortcut = "2.3.2"
ort = "=2.0.0-rc.10"
ndarray = "0.16"
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = "0.20.0"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
wasapi = "0.24"
